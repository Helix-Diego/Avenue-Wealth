services:
  - type: web
    name: avenue-wealth-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://ztlbdmdfxyzojxbkjodr.supabase.co
      - key: SUPABASE_PROJECT_ID
        value: ztlbdmdfxyzojxbkjodr
      - key: REQUIRE_AUTH
        value: "false"
      - key: CORS_ORIGINS
        value: "https://avenue-wealth.pages.dev,http://localhost:5173,http://localhost:8000"
